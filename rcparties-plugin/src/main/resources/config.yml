# RCParties — RC-SPEC-PARTIES-001
# Parties are in-memory only; nothing here survives a restart, by design.

# Maximum members in a party, including the leader.
max-party-size: 8

# How long an invite stays valid before it silently expires.
invite-ttl-seconds: 60

# When false, only the party leader may send invites.
allow-member-invites: true

# Player-facing wording is NOT here. It lives in RCUI's catalog:
#   plugins/RCUI/messages/rcparties.yml
# The packaged src/main/resources/messages.yml is the annotated reference for those keys.
# If you are upgrading and this file still has a 'messages:' block, it is no longer read --
# re-apply your wording in RCUI's catalog, then delete the block. RCParties warns on boot
# while a stale block is present.
